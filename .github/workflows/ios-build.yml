name: HarkinianPad iOS build

# Required, ROM-free proof for the sole project repository. Upstream source
# trees are pinned build inputs; this workflow never publishes to them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEPLOYMENT_TARGET: "14.0"

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test source verification boundaries
        run: python3 -m unittest discover -s tests -p '*_test.py'

      - name: Check tracked assets, history, scripts, patches, and docs
        run: scripts/check-repo-safety.sh

  ios-build:
    name: Full app (unsigned iPhoneOS)
    runs-on: macos-15
    timeout-minutes: 120
    needs: repository-safety

    steps:
      - uses: actions/checkout@v7

      - name: Install host archive-build dependencies
        run: >-
          brew install cmake ninja pkgconf sdl2 glew nlohmann-json libpng
          libzip tinyxml2 libogg libvorbis opus opusfile sdl2_net

      - name: Cache host and iOS dependencies
        uses: actions/cache@v6
        with:
          path: |
            build-host-soh/_deps
            build-ios-soh/_deps
          key: harkinianpad-ios-${{ runner.os }}-${{ hashFiles('sources.lock.json', 'patches/**', 'scripts/**') }}

      - name: Run controller lifecycle regression
        run: scripts/test-controller-reconnect.sh

      - name: Test maintained dependency preservation
        run: python3 -m unittest discover -s tests -p '*_test.py'

      - name: Reproduce unsigned arm64 iPhoneOS app
        run: scripts/build-ios.sh --device

      - name: Test pack import and selection boundaries
        run: scripts/test-mod-packs.sh

      - name: Audit unsigned package and signing gate
        run: |
          scripts/package-ios.sh
          if REQUIRE_SIGNED=1 scripts/package-ios.sh; then
            echo "Unsigned CI app unexpectedly passed REQUIRE_SIGNED=1" >&2
            exit 1
          fi

      - name: Retain audited IPA and checksum
        run: |
          cd artifacts
          shasum -a 256 HarkinianPad-*-unsigned.ipa > SHA256SUMS.txt

      - name: Upload audited device build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HarkinianPad-iPhone-iPad-${{ github.sha }}
          path: |
            artifacts/HarkinianPad-*-unsigned.ipa
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
